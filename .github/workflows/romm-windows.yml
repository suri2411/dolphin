# Windows-Bau fuer RomM Arcade. Dolphin bringt fuer Windows eine fertige
# Visual-Studio-Loesung samt vorgebauter Externals mit - hier ist deshalb
# nichts nachzuinstallieren ausser MSBuild.
#
# windows-2022, nicht windows-latest: auf dem neuen Abbild liegt Visual
# Studio 18, dessen Standardbibliothek Aufrufe wie __std_min_element_4i
# erzeugt. Die vorgebauten Externals von Dolphin 2606a kennen das Symbol
# nicht, und der Linker bricht mit LNK2019 ab. Mit der Werkzeugkette, gegen
# die Dolphin selbst baut, passt es zusammen.
name: RomM Arcade – Windows

on:
  push:
    branches: [romm-arcade]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      - name: Uebersetzen
        run: msbuild Source/dolphin-emu.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Einsammeln
        shell: pwsh
        run: |
          $ziel = "Binary/x64"
          if (-not (Test-Path $ziel)) { throw "Kein Ergebnis in $ziel" }
          Compress-Archive -Path "$ziel/*" -DestinationPath dolphin-romm-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-romm-windows
          path: dolphin-romm-x64.zip
          if-no-files-found: error
